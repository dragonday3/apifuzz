[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license metadata
build-backend = "hatchling.build"

[project]
# PyPI name: "apifuzz" belongs to another project. The import package and CLI command stay `apifuzz`.
name = "apifuzz-scanner"
dynamic = ["version"]
description = "API Security Testing Framework — OWASP API Top 10 test generation and execution"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["security", "api", "owasp", "dast", "fuzzing", "openapi", "sarif", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jsonref>=1.1",
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
    "anyio>=4.0",
]

[project.urls]
Homepage = "https://github.com/dragonday3/apifuzz"
Issues = "https://github.com/dragonday3/apifuzz/issues"
Benchmarks = "https://github.com/dragonday3/apifuzz/tree/main/benchmarks"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=5.0",
    "hatchling",
    "ruff==0.15.15",  # pinned: newer ruff turns on more rules by default; bump deliberately
    "mypy==2.1.0",
    "types-PyYAML",
]
docs = [
    "mkdocs-material==9.7.7",  # pinned: the site is built with --strict, a new theme release can add warnings
    "typer==0.25.1",  # pinned: docs-site/reference/cli.md is generated by typer and its format changes between versions
]

[project.scripts]
apifuzz = "apifuzz.cli:app"

[tool.hatch.version]
path = "src/apifuzz/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/apifuzz"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
