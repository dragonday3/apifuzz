[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apifuzz"
version = "0.1.0"
description = "API Security Testing Framework — OWASP API Top 10 test generation and execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jsonref>=1.1",
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=5.0",
    "hatchling",
]

[project.scripts]
apifuzz = "apifuzz.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/apifuzz"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
