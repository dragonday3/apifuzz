name: Docs

# Builds the MkDocs site (docs-site/) on every change that can affect it, checks that the generated CLI
# reference matches the CLI, and deploys to GitHub Pages from main.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "mkdocs.yml"
      - "src/apifuzz/**"         # the CLI reference is generated from the Typer app (cli.py and the defaults it imports)
      - "CHANGELOG.md"           # included in the site by pymdownx.snippets
      - "benchmarks/README.md"
      - "pyproject.toml"         # the pinned docs dependencies
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs-site/**"
      - "mkdocs.yml"
      - "src/apifuzz/**"         # the CLI reference is generated from the Typer app (cli.py and the defaults it imports)
      - "CHANGELOG.md"           # included in the site by pymdownx.snippets
      - "benchmarks/README.md"
      - "pyproject.toml"         # the pinned docs dependencies
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"

      - name: CLI reference is up to date
        run: |
          python -m typer apifuzz.cli utils docs --name apifuzz --output docs-site/reference/cli.md
          git diff --exit-code -- docs-site/reference/cli.md || {
            echo "::error file=docs-site/reference/cli.md::stale CLI reference: run the command above and commit the result"
            exit 1
          }

      - run: mkdocs build --strict

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false  # let a running deployment finish
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
